version: '3.5'
name: metric_scraper

services:
  vmagent-scraper:
    container_name: vmagent-scraper
    image: victoriametrics/vmagent
    ports:
      - "8429:8429"
    volumes:
      - ./vmagentdata:/vmagentdata
      - ./vmagent.yaml:/etc/vmagent/vmagent.yaml
    command:
      # This Writes to your Last9 Cluster. https://last9.io/docs/onboard/
      - "--remoteWrite.url=https://${last9_username}:${last9_password}@${last9_cluster_url}"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
